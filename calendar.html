<!DOCTYPE html>
<html>
    <head>
        <title>Страница</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="planner">
                <img src="t2_logo.png" alt="Фото" class="imt_t2">
                <div class="planner-header">
                    <h1>ПЛАНИРОВАНИЕ СМЕН</h1>
                    <div class="date-range">20 апреля — 5 мая</div>
                </div>
            </div>
        </header>
        
        <h1>Смены</h1>
        <div class="calendar" id="calendar"></div>
        <div class="type-selector">
            <button class="shift-btn" onclick="setMode('shift')">Смена</button>
            <button class="off-btn" onclick="setMode('off')">Отпуск</button>
            <button class="vac-btn" onclick="setMode('vac')">Выходной</button>
        </div>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-date">День</h3>

                <label>От:</label>
                <input type="time" id="startTime">

                <label>До:</label>
                <input type="time" id="endTime">

                <div class="modal-actions">
                    <button id="saveBtn">Сохранить</button>
                    <button id="closeBtn">Отмена</button>
                </div>
            </div>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
